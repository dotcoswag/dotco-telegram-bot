services:
  - type: web
    name: dotco-scraper-bot
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python -m bot.app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WEBHOOK_BASE_URL
        # Edit this after the first deploy to match your service URL,
        # e.g. https://dotco-scraper-bot.onrender.com
        sync: false
      - key: WEBHOOK_SECRET_TOKEN
        generateValue: true
      - key: GITHUB_PAT
        sync: false
      - key: GITHUB_LEADS_REPO
        value: dotcoswag/dotco-leads-db
